name: edition

# The board is static. RSS and pictures are collected here, headlines are
# translated to English on the runner (NLLB-200, CPU), then the edition is
# committed (src/data/news.json, public/img/news/) and photographed for
# KOReader (public/kindle/). The Vercel build only reads what is already in
# the tree. No OpenRouter call is required for the paper to come out in
# English.
#
# Note: GitHub disables scheduled workflows in repositories that stay quiet
# for 60 days; the "Run workflow" button wakes it up again. Cron is UTC:
# 03:00 is midnight in Brazil (UTC-3).

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: edition
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-translate.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: nllb-200-distilled-600M-ct2-${{ hashFiles('tools/requirements-translate.txt') }}

      - name: ImageMagick
        # Ubuntu ships ImageMagick 6 (`convert`/`identify`). tools/render-pages.mjs
        # accepts that or ImageMagick 7 (`magick`).
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - run: npm ci

      - name: Translate dependencies
        run: pip install -r tools/requirements-translate.txt

      - name: Fetch feeds and translate to English
        run: npm run news

      - name: Photograph the slides for the Kindle
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          npm run build
          npm run render
          rm -rf public/kindle
          cp -a dist/kindle public/kindle

      - name: Commit the edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json src/data/summaries.json public/img/news public/kindle
          if git diff --cached --quiet; then
            echo "Edition unchanged."
            exit 0
          fi
          git commit -m "Refresh the edition"
          git pull --rebase origin main
          git push
