name: edition

# The board is static. RSS, pictures and AI summaries are collected here,
# committed as the raw edition (src/data/news.json, src/data/summaries.json,
# public/img/news/), then photographed for KOReader (public/kindle/). The
# Vercel build only reads what is already in the tree. Summaries take minutes
# on the free models, which is why they never run inside a deploy.
#
# Setup (once):
#   GitHub -> repository secrets -> OPENROUTER_API_KEY
#
# Note: GitHub disables scheduled workflows in repositories that stay quiet
# for 60 days; the "Run workflow" button wakes it up again.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: edition
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: ImageMagick
        # Ubuntu ships ImageMagick 6 (`convert`/`identify`). tools/render-pages.mjs
        # accepts that or ImageMagick 7 (`magick`).
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - run: npm ci

      - name: Fetch feeds and write summaries
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run news

      - name: Photograph the slides for the Kindle
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          npm run build
          npm run render
          rm -rf public/kindle
          cp -a dist/kindle public/kindle

      - name: Commit the edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json src/data/summaries.json public/img/news public/kindle
          if git diff --cached --quiet; then
            echo "Edition unchanged."
            exit 0
          fi
          git commit -m "Refresh the edition"
          git pull --rebase origin main
          git push
