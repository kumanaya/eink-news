name: refresh

# The board is static, and the routine that feeds it (RSS, pictures, AI
# summaries) runs inside the Vercel build - see buildCommand in vercel.json.
# So there is nothing to run on a server: this workflow only asks Vercel to
# build again, and the builder does the work.
#
# Setup (once):
#   1. Vercel: project settings -> Git -> Deploy Hooks -> create one for `main`;
#   2. GitHub: repository secrets -> add VERCEL_DEPLOY_HOOK with that URL.
#
# Note: GitHub disables scheduled workflows in repositories that stay quiet for
# 60 days; the "Run workflow" button wakes it up again.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Vercel for a fresh edition
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is not set; see the header of this workflow"
            exit 1
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Vercel is building a new edition."
